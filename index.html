<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牙科診所 SOP 文件系統</title>
<style>
:root {
  --primary: #4A7A85;
  --primary-dark: #2D5560;
  --primary-light: #DFF1F1;
  --primary-soft: #5A8A95;
  --accent: #FF0000;
  --accent-light: #FFF0F0;
  --warn: #C47D00;
  --warn-light: #FFF8E6;
  --danger: #FF0000;
  --danger-light: #FFF0F0;
  --muted: #8AACB4;
  --handle: #BBD5DA;
  --panel: #DFF1F1;
  --panel-strong: #BBD5DA;
  --text: #1E3A42;
  --text-muted: #6A8A92;
  --border: rgba(187,213,218,0.7);
  --bg: #F5F5F5;
  --sidebar-w: 280px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Noto Sans TC", sans-serif; color: var(--text); background: var(--bg); display: flex; min-height: 100vh; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: #fff; color: var(--text);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; height: 100vh;
  overflow-y: auto; z-index: 100;
  border-right: 1px solid var(--panel-strong);
}
#sidebar-header { padding: 22px 18px 16px; border-bottom: 1px solid var(--border); }
#sidebar-header h1 { font-size: 14px; color: var(--text); font-weight: 700; line-height: 1.5; }
#sidebar-header p { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
#search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border); }
#search { width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
#search::placeholder { color: var(--text-muted); }
#search:focus { border-color: var(--primary); background: #fff; }
.nav-section { padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
.nav-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); padding: 6px 16px 4px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px; color: var(--text); border-left: 3px solid transparent; transition: all .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--panel); color: var(--primary); }
.nav-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--accent); font-weight: 600; }
.nav-item .tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--accent); color: #fff; flex-shrink: 0; margin-left: auto; }
.nav-item.active .tag { background: var(--accent); color: #fff; }

/* ── Main ── */
#main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }
#topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
#doc-title { font-size: 18px; font-weight: 700; color: var(--text); flex: 1; }
.btn { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
#content { padding: 32px; max-width: 900px; }

/* ── Doc content ── */
.doc h1 { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.doc .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
.doc .meta span { background: var(--bg); padding: 2px 8px; border-radius: 4px; }
.doc h2 { font-size: 18px; font-weight: 700; color: var(--primary); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--panel-strong); }
.doc h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 20px 0 8px; }
.doc p { line-height: 1.8; margin-bottom: 10px; }
.doc ul, .doc ol { padding-left: 22px; margin-bottom: 12px; }
.doc li { line-height: 1.9; font-size: 14.5px; }
.doc table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 14px; }
.doc th { background: var(--primary); color: #fff; padding: 9px 12px; text-align: left; font-weight: 600; }
.doc td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.doc tr:nth-child(even) td { background: var(--panel); }
.doc code { background: #f0f3f7; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
.doc pre { background: var(--panel); color: var(--primary-dark); border: 1px solid var(--panel-strong); padding: 16px 20px; border-radius: 8px; margin: 14px 0; overflow-x: auto; font-size: 13px; line-height: 1.7; }

/* Callouts */
.callout { border-radius: 8px; padding: 14px 16px; margin: 16px 0; border-left: 4px solid; }
.callout-note { background: var(--panel); border-color: var(--primary); }
.callout-warn { background: var(--warn-light); border-color: var(--warn); }
.callout-danger { background: var(--accent-light); border-color: var(--accent); }
.callout-tip { background: var(--panel); border-color: var(--panel-strong); }
.callout-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.callout-note .callout-title { color: var(--primary); }
.callout-warn .callout-title { color: var(--warn); }
.callout-danger .callout-title { color: var(--accent); }
.callout-tip .callout-title { color: var(--primary-soft); }

/* Checklist */
.checklist { list-style: none; padding: 0; margin: 12px 0 18px; }
.checklist li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 14.5px; line-height: 1.6; border-bottom: 1px solid #f0f3f7; }
.checklist li:last-child { border-bottom: none; }
.checklist input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
.checklist label { cursor: pointer; }
.checklist input:checked + label { text-decoration: line-through; color: var(--text-muted); }

/* Badge */
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.badge-pre { background: var(--accent); color: #fff; }
.badge-qm  { background: var(--accent); color: #fff; }
.badge-qp  { background: var(--accent); color: #fff; }
.badge-wsop{ background: var(--accent); color: #fff; }
.badge-ck  { background: var(--accent); color: #fff; }

/* Home page */
.home-hero { background: transparent; color: var(--text); padding: 36px 0 28px; border-radius: 0; margin-bottom: 28px; border-bottom: 2px solid var(--panel-strong); }
.home-hero-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); background: var(--panel); border: 1px solid var(--panel-strong); padding: 3px 10px; border-radius: 4px; margin-bottom: 14px; }
.home-hero h1 { font-size: 34px; font-weight: 800; color: var(--text); margin-bottom: 10px; line-height: 1.2; }
.home-hero p { font-size: 15px; color: var(--text-muted); line-height: 1.7; max-width: 640px; }
.home-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; text-align: center; }
.stat-num { font-size: 32px; font-weight: 800; color: var(--primary-soft); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.doc-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .15s; }
.doc-card:hover { border-color: var(--primary); box-shadow: 0 2px 12px rgba(45,74,85,.12); transform: translateY(-1px); }
.doc-card-id { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: .5px; }
.doc-card-title { font-size: 14px; font-weight: 700; margin: 4px 0; }
.doc-card-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.section-header { font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; margin: 24px 0 10px; text-transform: uppercase; }

/* Pyramid */
.pyramid { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin: 20px 0; }
.pyramid-row { display: flex; justify-content: center; margin-bottom: 6px; }
.pyramid-block { border-radius: 6px; padding: 10px 20px; text-align: center; font-weight: 700; font-size: 13px; color: #fff; }

/* Progress bar */
.progress-bar { background: #e8edf2; border-radius: 4px; height: 6px; margin: 6px 0 14px; }
.progress-fill { background: var(--primary); height: 100%; border-radius: 4px; transition: width .3s; }

/* Print */
@media print {
  #sidebar, #topbar { display: none; }
  #main { margin-left: 0; }
  #content { padding: 20px; }
}

/* Mobile */
@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); transition: transform .25s; }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }
  .home-stats { grid-template-columns: repeat(3, 1fr); }
  .doc-grid { grid-template-columns: 1fr; }
  #content { padding: 18px; }
}
.menu-btn { display: none; }
@media (max-width: 768px) { .menu-btn { display: flex; } }
</style>
</head>

 desc:'三圖確認、單向動線、設備選購三方向、裝修與電力',
 content:`
<div class="callout callout-danger"><div class="callout-title">🚫 動線一旦做錯，裝潢後幾乎無法補救</div></div>
<h2>設計階段五步</h2>
<ul class="checklist">
<li><input type="checkbox"><label><strong>空間需求確認</strong>：平面配置圖、系統圖、立面圖<strong>三圖確認</strong>，並整合品牌設計需求</label></li>
<li><input type="checkbox"><label><strong>設備清單對照</strong>：列出設備清單，確認符合空間與管路規劃需求</label></li>
<li><input type="checkbox"><label><strong>中央區與消毒室動線</strong>：由髒到乾淨<strong>單向流動</strong></label></li>
<li><input type="checkbox"><label><strong>轉換無紙化病歷</strong>：評估電子病歷、影像與資訊設備所需空間</label></li>
<li><input type="checkbox"><label><strong>施工、監工與工程報價</strong>：確認報價項目、工期、付款節點與監工責任</label></li>
</ul>
<div class="callout callout-note"><div class="callout-title">📌 三圖要同時審過一次</div><strong>平面決定「動線」、立面決定「感受」、系統圖決定「能不能施工」。</strong>三者請同時審過一次，避免現場才發現插座與給水位置對不上設備。設備尺寸、電壓、排水與空壓需求要在<strong>放樣前</strong>定案。</div>
<div class="callout callout-warn"><div class="callout-title">⚠ 發包提醒</div>請要求承包商<strong>逐項列出而非一式總價</strong>，並約定<strong>變更追加須書面確認</strong>。</div>
<h2>空間配置（雙診椅診所）</h2>
<table><tr><th>區域</th><th>功能</th><th>建議坪數</th></tr>
<tr><td>候診室</td><td>等待、衛教展示</td><td>5–8 坪</td></tr>
<tr><td>前台/掛號</td><td>接待、收費、電話預約</td><td>3–5 坪</td></tr>
<tr><td>診療室（每間）</td><td>主診療椅</td><td>5–8 坪</td></tr>
<tr><td>X 光室</td><td>根尖/OPG/CBCT</td><td>3–5 坪</td></tr>
<tr><td>滅菌室</td><td>器械清洗、滅菌、存放</td><td>3–5 坪</td></tr>
<tr><td>廁所</td><td>患者用 + 員工用</td><td>2–3 坪</td></tr>
<tr><td><strong>合計</strong></td><td></td><td><strong>約 30–50 坪</strong></td></tr></table>
<div class="callout callout-danger"><div class="callout-title">🚫 感染控制動線</div>清潔器械與污染器械的流向需明確分開，<strong>中央區與消毒室必須單向流動（髒進清出、不迴流）</strong>。這既是感控查核重點，也是日後工作效率的關鍵 — <strong>這一項做錯，代價最高</strong>。</div>
<h2>設備選購三方向</h2>
<p>每一項設備都用這三個角度過一次：<strong>功能需求、安全性、日常維護</strong>。</p>
<table><tr><th>類別</th><th>項目</th><th>選購重點</th></tr>
<tr><td>影像設備</td><td>環口 X 光、CT、口內掃描與影像管理</td><td><strong>法規登記與交機時程請提早確認</strong></td></tr>
<tr><td>診療設備</td><td>診療椅、空壓機、吸唾機</td><td>議價之外，務必確認<strong>保固範圍、到場維修時效與備用機改策</strong></td></tr>
<tr><td>消毒設備</td><td>滅菌鍋、清洗、包裝設備、器械追溯機制</td><td>滅菌對應<strong>尖峰時段的器械週轉速度</strong>，保留<strong>生物與化學指示劑紀錄</strong></td></tr>
<tr><td>弱電系統</td><td>監視、網路、電話、保全與廣播</td><td>健保 VPN、雲端病歷、影像傳輸都吃網路穩定度，<strong>建議以有線為主</strong></td></tr>
<tr><td>診所管理系統</td><td>掛號、病歷、收費、預約與健保申報整合</td><td>見下方</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">⚠ 設備停機的真實成本</div><strong>設備停機一天的損失，通常遠大於議價下的金額。</strong>保固與維修條款要一起談進合約，不要只比價。</div>
<div class="callout callout-tip"><div class="callout-title">💡 器械追溯</div>滅菌設備要能保留生物與化學指示劑紀錄，<strong>每一批次都應可追溯到日期、機器與操作者</strong>。這是感控查核必看的項目。</div>
<h2>診所管理系統：簽約前一定要做的事</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 實際試操作全流程</div><strong>掛號 → 看診 → 收費 → 預約 → 申報</strong>整串跑一次，並確認：</div>
<ul class="checklist">
<li><input type="checkbox"><label>能否串接<strong>影像系統</strong>與<strong>預約提醒</strong></label></li>
<li><input type="checkbox"><label><strong>資料是否可完整匯出</strong>（未來換系統時，這一點決定你會不會被綁死）</label></li>
<li><input type="checkbox"><label>健保申報功能是否符合最新規範</label></li>
<li><input type="checkbox"><label>是否支援行動裝置查看、教育訓練是否完善</label></li>
</ul>
<h3>電子病歷（無紙化）</h3>
<div class="callout callout-note"><div class="callout-title">📌 導入時一併設定</div>電子病歷的簽章、<strong>備份與稽核軌跡</strong>都有規範要求，<strong>導入時就一併設定好</strong>，日後不必回頭補資料。</div>
<h2>核心設備清單</h2>
<table><tr><th>設備</th><th>規格建議</th><th>概估費用</th><th>交期</th></tr>
<tr><td>牙科治療椅</td><td>電動式，含燈、水氣槽</td><td>NT$30–80 萬/張</td><td>8–12 週</td></tr>
<tr><td>根尖 X 光機</td><td>數位感應器（RVG）優先</td><td>NT$15–30 萬</td><td>4–6 週</td></tr>
<tr><td>全口曲面斷層（OPG）</td><td>數位式</td><td>NT$60–120 萬</td><td>6–10 週</td></tr>
<tr><td>高壓滅菌鍋</td><td>Class B，22L 以上</td><td>NT$15–30 萬</td><td>4 週</td></tr>
<tr><td>超音波洗淨機</td><td>酵素清洗液配套</td><td>NT$3–8 萬</td><td>2 週</td></tr>
<tr><td>空壓機</td><td>靜音型，油壓分離式</td><td>NT$5–15 萬</td><td>2 週</td></tr>
<tr><td>AED</td><td>急救必備</td><td>NT$3–8 萬</td><td>1 週</td></tr></table>
<div class="callout callout-note"><div class="callout-title">📋 電力規劃重點</div>高壓滅菌鍋需三相 220V，CBCT 依機型需求。裝修前請電機技師確認總電力負荷，避免開業後跳電。</div>`
},
{id:'PRE-04', cat:'PRE', title:'感染管制 SOP', badge:'badge-pre',
 desc:'清消、手部衛生、滅菌流程、廢棄物分類、針扎處理',
 content:`
<h2>一、診間清消</h2>
<h3>每診次之間</h3>
<ul class="checklist" id="chk-pre04-1">
<li><input type="checkbox"><label>更換手套</label></li>
<li><input type="checkbox"><label>治療椅（椅面、扶手、頭靠、燈桿、托盤）酒精消毒濕巾擦拭</label></li>
<li><input type="checkbox"><label>痰盂沖洗並噴消毒液</label></li>
<li><input type="checkbox"><label>拋棄式物品統一丟棄</label></li>
<li><input type="checkbox"><label>補充下一位患者所需拋棄式耗材</label></li></ul>
<h3>牙科水路（Dental Unit Waterline）管理</h3>
<table><tr><th>頻率</th><th>動作</th></tr>
<tr><td>每日開診前</td><td>各水路放水 30 秒後開始使用</td></tr>
<tr><td>每診次後</td><td>三用槍放水 20–30 秒沖洗管路</td></tr>
<tr><td>每週</td><td>依廠商指引執行水路消毒</td></tr>
<tr><td>每半年</td><td>送水樣本至合格實驗室檢測菌落數</td></tr></table>
<h2>二、器械滅菌流程</h2>
<pre>使用後器械 → 流水沖洗 → 超音波清洗（10–15 分鐘）
→ 沖洗擦乾 → 目視檢查 → 紙塑袋包裝 + 封口
→ 貼標籤（日期/批號/效期）→ 高壓滅菌（134°C/18分鐘）
→ 確認指示劑變色 ✓ → 乾燥存放</pre>
<h2>三、廢棄物分類</h2>
<table><tr><th>種類</th><th>容器</th><th>範例</th></tr>
<tr><td>感染性廢棄物</td><td>紅色廢棄物袋</td><td>血液沾染紗布、手套、口罩</td></tr>
<tr><td>尖銳物</td><td>銳器桶（黃色）</td><td>針頭、刀片、銼刀</td></tr>
<tr><td>一般垃圾</td><td>一般垃圾袋</td><td>未沾血的紙巾、包裝</td></tr></table>
<h2>四、針扎事件緊急處理</h2>
<div class="callout callout-danger"><div class="callout-title">🚨 發生針扎立即執行</div></div>
<ul class="checklist" id="chk-pre04-2">
<li><input type="checkbox"><label>立即脫除手套</label></li>
<li><input type="checkbox"><label>傷口流水沖洗至少 15 分鐘（不可擠壓）</label></li>
<li><input type="checkbox"><label>通知主管</label></li>
<li><input type="checkbox"><label>填寫針扎事件報告表</label></li>
<li><input type="checkbox"><label>評估源頭患者風險（HIV / HBV / HCV 快篩）</label></li>
<li><input type="checkbox"><label>就醫評估（PEP 預防用藥需在 72 小時內開始）</label></li>
<li><input type="checkbox"><label>後續追蹤（6 週、3 個月、6 個月）</label></li></ul>`
},
{id:'PRE-05', cat:'PRE', title:'健保申報 SOP', badge:'badge-pre',
 ver:'v2.0', date:'2026-09-13',
 desc:'月申報、電子病歷、抽審應對、核減申復與流程回饋',
 content:`
<div class="callout callout-note"><div class="callout-title">📌 核心原則</div><strong>病歷寫得完整，永遠比事後解釋有效。</strong></div>
<div class="callout callout-warn"><div class="callout-title">⚠ 新特約診所請特別注意</div><strong>新特約院所受關注度較高</strong>，病歷記載的完整性是抽審成敗的關鍵。</div>
<h2>開業健保作業五項</h2>
<ul class="checklist">
<li><input type="checkbox"><label><strong>月申報作業（雙軌）</strong>：確認每月申報流程、期限與<strong>內部核核機制</strong></label></li>
<li><input type="checkbox"><label><strong>電子病歷審查申請</strong>：確認電子病歷實施與審查申請程序</label></li>
<li><input type="checkbox"><label><strong>健保抽審應對</strong>：掌握抽審週期與應備文件</label></li>
<li><input type="checkbox"><label><strong>新特約指標</strong>：依健保分區而異，向當地業務組確認</label></li>
<li><input type="checkbox"><label><strong>核減與申復處理</strong>：指定<strong>專人</strong>追蹤核減原因並於期限內申復</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 顧問提醒</div>
<ul><li>建立每月固定的<strong>「申報前自我檢查日」</strong>。申報錯誤的影響往往不只是金額，而是後續抽審的印象</li>
<li>電子病歷的簽章、備份與<strong>稽核軌跡</strong>都有規範要求，<strong>導入時就一併設定好</strong></li>
<li>把核減原因<strong>回饋到臨床與登錄流程</strong>，同一種錯誤才不會反覆發生</li></ul></div>
<h2>每月申報時程</h2>
<table><tr><th>時段</th><th>申報案件</th><th>截止日</th></tr>
<tr><td>1 日–15 日</td><td>上半月醫療服務</td><td>次月 10 日前</td></tr>
<tr><td>16 日–月底</td><td>下半月醫療服務</td><td>次月 20 日前</td></tr>
<tr><td>全月（整批）</td><td>當月全部案件</td><td>次月 20 日前</td></tr></table>
<div class="callout callout-danger"><div class="callout-title">⚠ 逾期申報後果</div>未依期限申報者，申報當月不予暫付；延遲申報可能被列為異常案件。</div>
<h2>申報前自查清單</h2>
<ul class="checklist" id="chk-pre05-1">
<li><input type="checkbox"><label>每位患者當月就診有主訴、處置記錄、X 光或照片</label></li>
<li><input type="checkbox"><label>侵入性治療有同意書（拔牙、根管、手術）</label></li>
<li><input type="checkbox"><label>技工單日期能對應申報項目</label></li>
<li><input type="checkbox"><label>申報處置碼與病歷記載一致</label></li>
<li><input type="checkbox"><label>根管治療：申報次數與工作長度測量、根尖 X 光相符</label></li>
<li><input type="checkbox"><label>牙周治療：Periodontal Charting 有書面或數位記錄</label></li></ul>
<h2>健保三層管控機制</h2>
<table><tr><th>層級</th><th>觸發情境</th><th>要求提供</th></tr>
<tr><td>輔導</td><td>申報量異常、點值偏高</td><td>醫日報表、申報案件明細</td></tr>
<tr><td>醫療確認單</td><td>前項後仍異常</td><td>醫療確認單（逐案說明）</td></tr>
<tr><td>醫療品質監控期</td><td>持續異常或重大疑義</td><td>確認單 + 診療證明文件</td></tr></table>
<h2>收到公文後處理流程</h2>
<pre>收到公文 → 指定負責人、建立案件編號
  ↓ 確認回覆期限（通常 14–30 天）
  ↓ 整理病歷、X 光、照片、同意書、技工單
  ↓ 治療醫師補充 Clinical Rationale
  ↓ 負責醫師審閱確認
  ↓ 送件（保留版本 + 附件清單）
  ↓ 記錄後續結果</pre>
<h2>核減後的流程回饋（最常被略過的一步）</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 只申復不改流程，明年還會再遇到</div></div>
<pre>核減通知 → 專人追蹤原因 → 期限內申復（通常 30 日）
        ↓
  分類核減原因（病歷不足？登錄錯誤？處置碼誤用？）
        ↓
  回饋到臨床與登錄流程 ── 修正 SOP / 病歷模板 / 教育訓練
        ↓
  次月申報前自我檢查日驗證改善</pre>
<ul class="checklist">
<li><input type="checkbox"><label>每季彙整核減原因分類統計</label></li>
<li><input type="checkbox"><label>高頻核減原因列入月會討論（WSOP-13）</label></li>
<li><input type="checkbox"><label>對應修正病歷模板或記載要求（PRE-06）</label></li>
</ul>
<h2>電子病歷</h2>
<ul class="checklist">
<li><input type="checkbox"><label>確認<strong>電子病歷實施與審查申請程序</strong></label></li>
<li><input type="checkbox"><label>簽章機制符合規範</label></li>
<li><input type="checkbox"><label><strong>備份機制</strong>設定完成</label></li>
<li><input type="checkbox"><label><strong>稽核軌跡（audit trail）</strong>設定完成</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 系統選型時就要確認</div>資料可完整匯出 — 見 PRE-03 診所管理系統。</div>`
},
{id:'PRE-06', cat:'PRE', title:'病歷與同意書 SOP', badge:'badge-pre',
 ver:'v2.0', date:'2026-09-13',
 desc:'SOAP 格式、臨床攝影規格、各療程同意書、廣告合規',
 content:`
<h2>初診病歷必填欄位</h2>
<table><tr><th>欄位</th><th>內容</th></tr>
<tr><td>主訴</td><td>患者來診主要原因，以患者用語記錄</td></tr>
<tr><td>過敏史</td><td>藥物、麻醉藥、材料過敏（無過敏記錄「NKA」）</td></tr>
<tr><td>系統性疾病</td><td>糖尿病、高血壓、心臟病、骨質疏鬆、服藥狀況</td></tr>
<tr><td>口腔檢查</td><td>牙齒現況、缺牙、修復物、軟組織</td></tr>
<tr><td>X 光讀片</td><td>初診全口 X 光臨床意義</td></tr>
<tr><td>治療計畫</td><td>建議療程優先順序說明</td></tr></table>
<h2>SOAP 格式（每次就診）</h2>
<table><tr><th>項目</th><th>說明</th></tr>
<tr><td><strong>S</strong>ubjective</td><td>患者主訴（今天有什麼問題、感覺）</td></tr>
<tr><td><strong>O</strong>bjective</td><td>臨床發現（探測、視診、X 光、冷熱測試等）</td></tr>
<tr><td><strong>A</strong>ssessment</td><td>診斷（用正確診斷名稱，必要時附 ICD 碼）</td></tr>
<tr><td><strong>P</strong>lan</td><td>治療計畫 + 今日執行 + 下次療程說明</td></tr></table>
<h2>臨床攝影規格（健保抽審用）</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 要的是「術前／術中／術後」三個時點</div>依《全民健康保險醫事服務機構醫療服務審查辦法》第四條（衛署健保字第 0942600257 號令），被抽審時需提供的「診療相關證明文件」為：<strong>X 光片</strong>、<strong>術前／術中／術後臨床彩色照片（須註明日期，尺寸至少 3×5 吋）</strong>、保險醫療費用明細表。<br><br><strong>多數人只拍術前與術後 — 缺「術中」事後完全補不回來。</strong>這是開業第一天就要建立的習慣。詳見 PRE-10。</div>
<ul class="checklist">
<li><input type="checkbox"><label><strong>術前</strong>照片（彩色、註明日期）</label></li>
<li><input type="checkbox"><label><strong>術中</strong>照片（彩色、註明日期）← 最常漏</label></li>
<li><input type="checkbox"><label><strong>術後</strong>照片（彩色、註明日期）</label></li>
<li><input type="checkbox"><label>照片尺寸符合規格（至少 3×5 吋）</label></li>
<li><input type="checkbox"><label>照片納入病歷系統，與就診日期對應</label></li>
<li><input type="checkbox"><label>患者同意書含同意攝影並使用於醫療記錄</label></li>
</ul>
<h2>需取得同意書的情境</h2>
<table><tr><th>情境</th><th>同意書種類</th></tr>
<tr><td>所有患者初診</td><td>一般診療同意書（含個資使用同意）</td></tr>
<tr><td>牙齒拔除</td><td>拔牙手術同意書</td></tr>
<tr><td>根管治療</td><td>根管治療同意書</td></tr>
<tr><td>植牙手術</td><td>植牙手術同意書（含補骨、上頜竇手術等）</td></tr>
<tr><td>牙周手術</td><td>牙周手術同意書</td></tr>
<tr><td>未成年人</td><td>法定代理人（家長）簽署</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">📣 醫療廣告合規</div>
<strong>禁止</strong>：宣稱療效保證/成功率、使用 Before/After 照片（未核准）、誇大療效<br>
<strong>合規</strong>：診所名稱地址電話、看診時間、醫師姓名學歷、服務科別</div>`
},

{id:'PRE-08', cat:'PRE', title:'品牌與空間識別', badge:'badge-pre',
 ver:'v1.0', date:'2026-09-13',
 desc:'命名、識別設計、招牌法規、指標系統、周邊製作物',
 content:`
<div class="callout callout-note"><div class="callout-title">📌 品牌創造價值，價值創造病人</div>這一段有兩個面向：設計面（識別、招牌、周邊）與<strong>法規面</strong>（命名規範、醫療廣告限制、無障礙標示）。法規面沒過，設計再好也要重做。</div>
<h2>一、診所命名</h2>
<ul class="checklist">
<li><input type="checkbox"><label>名稱須符合<strong>醫療機構名稱規範</strong></label></li>
<li><input type="checkbox"><label>查詢是否有<strong>既存同名診所</strong></label></li>
<li><input type="checkbox"><label>查詢是否有<strong>既存商標</strong></label></li>
<li><input type="checkbox"><label>同步確認<strong>網域</strong>與<strong>社群帳號</strong>是否還能註冊</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 三者一起查</div>避免名字定了才發現網域被佔、或商標踩線。</div>
<h2>二、品牌價值與識別設計</h2>
<p>目的：做出市場區隔、凝聚內部向心力、達成行銷目的、維護客戶忠誠度。</p>
<div class="callout callout-warn"><div class="callout-title">⚠ 交付物要求</div>請設計方交付<strong>可延伸的完整檔案與色票規範</strong>，日後每製作一份物件才不必重新描圖。</div>
<ul class="checklist">
<li><input type="checkbox"><label>標準字 / Logo（向量檔 AI、SVG）</label></li>
<li><input type="checkbox"><label>色票規範（CMYK / RGB / Pantone）</label></li>
<li><input type="checkbox"><label>字體規範</label></li>
<li><input type="checkbox"><label>應用範例（名片、招牌、單張、社群版型）</label></li>
<li><input type="checkbox"><label>原始可編輯檔案（非只有 PNG／JPG）</label></li>
</ul>
<h2>三、戶外招牌與形象牆</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 招牌是醫療廣告</div>
<ul><li>招牌<strong>尺寸與設置</strong>須符合規定</li>
<li><strong>醫療廣告內容有法定限制</strong>（須避免療效保證、不當招引）</li>
<li><strong>設計定稿前</strong>，先確認法規與<strong>房東同意</strong></li></ul></div>
<ul class="checklist">
<li><input type="checkbox"><label>招牌設計</label></li>
<li><input type="checkbox"><label>施作與法規確認（同步進行）</label></li>
<li><input type="checkbox"><label>房東同意書</label></li>
</ul>
<h2>四、空間指標系統</h2>
<ul class="checklist">
<li><input type="checkbox"><label>診間編號</label></li>
<li><input type="checkbox"><label>洗手間標示</label></li>
<li><input type="checkbox"><label><strong>無障礙等標示</strong>（法定要求）</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 指標不只是美感</div><strong>更是初診病人的安心感來源</strong>，也能大幅減少櫃檯重複指路的負擔。無障礙標示屬法定要求，設計時一併納入，不要等查核才補。</div>
<h2>五、周邊製作物</h2>
<ul class="checklist">
<li><input type="checkbox"><label>名片</label></li>
<li><input type="checkbox"><label>口杯</label></li>
<li><input type="checkbox"><label>制服</label></li>
<li><input type="checkbox"><label>信封</label></li>
<li><input type="checkbox"><label>衛教單張</label></li>
<li><input type="checkbox"><label>預約卡</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 先小量試作</div><strong>建議先小量試作確認顏色與觸感，再下大量訂單。</strong>螢幕上的顏色與實際印刷、布料上的顏色常有落差。</div>`
},
{id:'PRE-09', cat:'PRE', title:'開幕活動 SOP', badge:'badge-pre',
 ver:'v1.0', date:'2026-09-13',
 desc:'茶會規劃、邀請名單、宣傳合規、當日分工',
 content:`
<div class="callout callout-note"><div class="callout-title">📌 目的是建立信任與在地連結，不是塞滿場地</div>開幕活動的成效不看當天來了多少人，看的是<strong>帶來多少長期的轉診網絡與初診</strong>。</div>
<h2>一、開幕茶會規劃</h2>
<ul class="checklist">
<li><input type="checkbox"><label>場地</label></li>
<li><input type="checkbox"><label>時段</label></li>
<li><input type="checkbox"><label>人數與活動流程</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 顧問提醒</div><strong>讓來訪者「看見你的用心」，比送出多少贈品都有效。</strong>與其把預算砸在贈品，不如花在導覽動線、診所介紹、與醫師本人跟每位來賓實際講到話。</div>
<h2>二、邀請函設計與發送</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 別忘了轉診來源與地區同業</div><strong>長期的轉診網絡，往往比單次活動的人流更有價值。</strong>牙周／植牙專科尤其如此 — 地區一般科診所是主要轉診來源。</div>
<table><tr><th>對象</th><th>邀請重點</th><th>後續追蹤</th></tr>
<tr><td>地區一般科診所</td><td>建立轉診關係、說明診所專長項目</td><td>開幕後一個月內致意 + 轉診單提供</td></tr>
<tr><td>在地里鄰、里長</td><td>社區能見度</td><td>納入社區衛教活動名單</td></tr>
<tr><td>供應商、技工所</td><td>合作關係</td><td>納入固定聯繫窗口</td></tr>
<tr><td>親友</td><td>初期人流與口碑</td><td>—</td></tr></table>
<h2>三、宣傳素材與線上曝光</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 醫療廣告合規</div><strong>醫療廣告內容受法規限制，須避免療效保證，比較性用語需謹慎、避免不當招引。</strong>開幕優惠文案尤其容易踩線 — 折扣本身可以，但不能搭配療效承諾。</div>
<ul class="checklist">
<li><input type="checkbox"><label>官網</label></li>
<li><input type="checkbox"><label>社群</label></li>
<li><input type="checkbox"><label>地圖資訊（Google 我的商家 GMB）</label></li>
<li><input type="checkbox"><label>開幕文案經醫療廣告合規檢視</label></li>
<li><input type="checkbox"><label>所有素材套用品牌規範（PRE-08）</label></li>
</ul>
<h2>四、當日人力與備品分工</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 活動當天仍可能有初診病人</div><strong>請保留基本看診能量，與一位不參與活動的值班人員。</strong>開幕當天走進來的初診，是最不該漏接的病人。</div>
<table><tr><th>崗位</th><th>職責</th></tr>
<tr><td>接待</td><td>簽到、引導、發放資料</td></tr>
<tr><td>導覽</td><td>診所環境介紹、設備說明</td></tr>
<tr><td><strong>看診值班</strong></td><td><strong>不參與活動</strong>，負責當日初診／急症</td></tr>
<tr><td>主持／致詞</td><td>流程掌控</td></tr>
<tr><td>攝影記錄</td><td>素材留存（供後續社群使用）</td></tr></table>
<h2>五、活動後追蹤</h2>
<ul class="checklist">
<li><input type="checkbox"><label>來賓名單整理與分類建檔</label></li>
<li><input type="checkbox"><label>轉診同業一個月內致意</label></li>
<li><input type="checkbox"><label>活動照片整理 → 社群後續使用</label></li>
<li><input type="checkbox"><label>當日初診患者納入回診追蹤（WSOP-12）</label></li>
<li><input type="checkbox"><label>新患者來源記錄（活動 vs GMB vs 口碑）（WSOP-11）</label></li>
</ul>`
},
{id:'PRE-10', cat:'PRE', title:'新開業申報限制與指標管控（北區）', badge:'badge-pre',
 ver:'v1.0', date:'2026-09-13',
 desc:'觀察期門檻、7 項指標、階梯式監控、抽審應備文件',
 content:`
<div class="callout callout-danger"><div class="callout-title">🚫 這不是「申報上限」，是「觸發抽審的門檻」</div>常見誤解是把 32 萬／70 萬當成不能超過的天花板。<strong>實際上超過不是不給錢，而是該院所案件抽審一個月，並執行指標管控。</strong><br><br>誤解的代價是反過來的：因為怕「超過上限」而刻意壓低申報、推遲病人治療，反而在臨床與營運上都不划算。正確做法是<strong>知道門檻在哪、知道哪些項目不計入、把病歷寫到禁得起抽審</strong>。</div>
<div class="callout callout-warn"><div class="callout-title">⚠ 分區與版本</div>本頁為<strong>健保署北區業務組</strong>規定（桃園、新竹、苗栗），版本 <strong>108.03.28</strong>。
<ul><li><strong>其他分區（南區、高屏等）數字與規則不同</strong>，請向當地業務組與公會確認</li>
<li>原文註明「本規定執委會得<strong>每三個月檢討一次</strong>」，數字會變，開業前請重新索取最新版</li></ul></div>
<h2>一、誰受規範</h2>
<p><strong>新開業院所定義</strong>：向健保署申請新的診所代碼，即屬新開業院所，院所之負責醫師即為新開業醫師。</p>
<div class="callout callout-warn"><div class="callout-title">⚠ 範圍是全院所，不只負責醫師</div>該院所內<strong>所有醫師（含開業及服務醫師）皆須遵循</strong>新加入會員暨新開業會員之申報規定。</div>
<h3>三種可申請排除的特殊狀況</h3>
<table><tr><th>#</th><th>情況</th><th>條件</th></tr>
<tr><td>1</td><td>同縣市搬遷取得新代碼</td><td>於同縣市<strong>開業滿一年以上</strong>且<strong>未曾受健保署處分</strong></td></tr>
<tr><td>2</td><td>更換負責醫師的院所</td><td>最近一年院所 21 項指標第 <strong>14、16、18、21</strong> 項在北區平均值以下，且未曾受處分</td></tr>
<tr><td>3</td><td>資深牙醫師原縣市新開業</td><td>同縣市曾領有<strong>開業執照滿一年以上</strong>，或<strong>服務滿十年以上</strong>，且未曾離開原執業縣市</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">⚠ 排除條款的兩個限制</div>
<ul><li>第 3 項<strong>排除曾停止特約及終止特約之牙醫師</strong></li>
<li>申請排除成功者（以及 1:4500 以上人口地區者）<strong>仍應於觀察期內監控院所指標數據</strong> — 排除的是申報額度限制，不是指標管控</li></ul></div>
<p><strong>人口密度豁免</strong>：1:4500 以上人口地區不受新開業限制。</p>
<h2>二、申報額度門檻</h2>
<table><tr><th>對象</th><th>觀察期</th><th>門檻</th></tr>
<tr><td><strong>新開業醫師</strong></td><td><strong>1 年</strong></td><td>單一醫師每月申報 <strong>32 萬</strong>，或院所申報總金額 <strong>70 萬</strong></td></tr>
<tr><td><strong>新服務醫師</strong>（受僱）</td><td><strong>半年</strong></td><td>每月申報 <strong>小於 32 萬</strong>則不受本規定限制</td></tr></table>
<h3>超過門檻會怎樣</h3>
<pre>觀察期內某月「最高申報額度醫師 &gt; 32 萬」或「院所總額 &gt; 70 萬」
        ↓
該院所案件「抽審一個月」＋ 執行指標管控</pre>
<div class="callout callout-note"><div class="callout-title">📌 70 萬怎麼算出來的</div>原文說明：統計一位醫師平均申報金額 × 一間診所平均醫師數。此為台北分區 70 萬的由來；北區統計值小於 70 萬，經討論<strong>放寬</strong>以 70 萬計。</div>
<h2>三、不計入門檻的扣除項目</h2>
<div class="callout callout-tip"><div class="callout-title">💡 牙周專科特別注意</div><strong>牙周病統合治療三個階段全部不計入門檻。</strong>這對以牙周治療為主力的診所，是觀察期內很關鍵的空間。</div>
<table><tr><th>類別</th><th>項目</th></tr>
<tr><td><strong>牙周病統合治療</strong></td><td><strong>91021C</strong>（第一階段）、<strong>91022C</strong>（第二階段）、<strong>91023C</strong>（第三階段）</td></tr>
<tr><td>假日</td><td>週日及國定假日申報點數（以<strong>申報就醫日期</strong>認定）</td></tr>
<tr><td>專款項目</td><td>無牙醫鄉執業、巡迴及特殊服務項目：<strong>案件類別 14、16</strong></td></tr>
<tr><td>矯正機關</td><td>收容於矯正機關者醫療服務計畫</td></tr>
<tr><td>預防保健</td><td><strong>案件分類 A3</strong>（牙齒預防保健案件）</td></tr>
<tr><td>戒菸</td><td><strong>案件分類 B7</strong>（代辦戒菸服務補助計畫）</td></tr></table>
<h2>四、指標管控</h2>
<h3>絕對指標（4 項）</h3>
<table><tr><th>#</th><th>指標</th><th>門檻</th><th>計算單位</th></tr>
<tr><td>a</td><td>申請總金額</td><td>進入<strong>前 3%</strong></td><td>—</td></tr>
<tr><td>b</td><td>重複洗牙率</td><td>高於全區 <strong>90</strong> 百分位</td><td>—</td></tr>
<tr><td>c</td><td><strong>OD 耗值</strong></td><td>高於全區 <strong>75</strong> 百分位</td><td><strong>季</strong></td></tr>
<tr><td>d</td><td>就醫病患平均耗用值</td><td>高於 <strong>75</strong> 百分位</td><td><strong>月</strong></td></tr></table>
<h3>相對指標（3 項）</h3>
<table><tr><th>#</th><th>指標</th><th>門檻</th></tr>
<tr><td>a</td><td>平均填補顆數</td><td>高於 75 百分位</td></tr>
<tr><td>b</td><td>二年他家重補率</td><td>高於 75 百分位</td></tr>
<tr><td>c</td><td>OD 佔率</td><td>—</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">⚠ 換算規則</div><strong>2 個相對指標 = 1 個絕對指標</strong></div>
<h3>階梯式監控流程</h3>
<pre>2 個絕對指標進入
        ↓
醫療品質監控措施：抽審並追蹤 2 個月
        ↓
第一次追蹤期間有 1 個月進入
        ↓
檢附診療相關證明文件 3 個月
        ↓
檢附期間有 2 個月進入 → 延長檢附 3 個月</pre>
<p><strong>兩個附帶機制</strong></p>
<ul>
<li>追蹤 3 個月期間，<strong>任一費用月</strong>進入 → 通知院所前來<strong>教育相談</strong></li>
<li><strong>持續進入「醫療品質監控期」二次</strong> → 依衛署健保字第 0942600257 號令提供診療相關文件，為期 3 個月，經委員會檢討後決議是否解除</li>
</ul>
<h2>五、診療相關證明文件（被抽到時要交什麼）</h2>
<p><strong>法源</strong>：《全民健康保險醫事服務機構醫療服務審查辦法》第四條（衛署健保字第 0942600257 號令）</p>
<table><tr><th>#</th><th>文件</th><th>規格要求</th></tr>
<tr><td>1</td><td><strong>X 光片</strong></td><td>—</td></tr>
<tr><td>2</td><td><strong>術前、術中、術後臨床彩色照片</strong></td><td><strong>須註明日期</strong>；彩色照片尺寸至少 <strong>3×5 吋</strong></td></tr>
<tr><td>3</td><td>保險醫療費用明細表</td><td>—</td></tr></table>
<div class="callout callout-danger"><div class="callout-title">🚫 「術中」照片最容易漏</div>多數人只拍術前與術後。規定明確要求<strong>術前、術中、術後三個時點</strong>，且要註明日期。<strong>這是開業第一天就要建立的攝影習慣 — 事後補不回來。</strong></div>
<h2>六、新服務醫師（受僱醫師）</h2>
<ul>
<li>觀察期 <strong>半年</strong></li>
<li>1:4500 以上人口地區不受新開業新服務限制</li>
<li><strong>廢除三聯單，日報表仍需填寫</strong></li>
<li>半年內每月申報額度 <strong>小於 32 萬</strong>（扣除項目同上），則不受本規定限制</li>
</ul>
<h2>七、其他程序規定</h2>
<ul>
<li>填寫日報表日期、抽審＋立意審查月份，<strong>皆依院所收到公文上之指示日期</strong>開始實施</li>
<li>本規定執委會得<strong>每三個月檢討一次</strong></li>
</ul>
<h2>開業前檢核</h2>
<ul class="checklist">
<li><input type="checkbox"><label>向<strong>開業所在地公會</strong>索取現行版本（本版為 108.03.28）</label></li>
<li><input type="checkbox"><label>確認所在分區（桃園＝北區；其他縣市數字不同）</label></li>
<li><input type="checkbox"><label>確認是否符合三種排除條款之一</label></li>
<li><input type="checkbox"><label>確認所在地是否為 1:4500 以上人口地區</label></li>
<li><input type="checkbox"><label>試算：主力療程中哪些屬扣除項目（91021C/91022C/91023C、A3、B7）</label></li>
<li><input type="checkbox"><label>建立<strong>術前／術中／術後</strong>臨床攝影 SOP（彩色、註明日期、至少 3×5）</label></li>
<li><input type="checkbox"><label>建立日報表填寫流程</label></li>
<li><input type="checkbox"><label>觀察期內每月自我監控 7 項指標</label></li>
</ul>`
},
{id:'QM-01', cat:'QM', title:'診所管理手冊', badge:'badge-qm',
 desc:'使命、願景、組織架構、醫師雙重角色、管理總則',
 content:`
<h2>診所核心理念</h2>
<table><tr><th>項目</th><th>內容</th></tr>
<tr><td><strong>使命</strong></td><td>為患者提供安全、舒適、高品質的牙科醫療服務，以專業和同理心建立長期信賴關係。</td></tr>
<tr><td><strong>願景</strong></td><td>成為社區首選的全科牙醫診所，建立可複製的標準化營運體系，具備連鎖擴張能力。</td></tr></table>
<h3>核心價值</h3>
<ul>
<li><strong>專業</strong>：持續精進臨床技術，以 Evidence-Based 醫療為基礎</li>
<li><strong>誠信</strong>：對患者誠實說明療程與費用，不誇大不欺瞞</li>
<li><strong>效率</strong>：SOP 化日常流程，讓每位員工都能達到穩定水準</li>
<li><strong>關懷</strong>：患者的關心不止於診療，更延伸至術後追蹤</li></ul>
<h2>組織架構</h2>
<pre>院長
├── 主治醫師
│   └── 跟診助理（各診）
└── 診所主管（行政長）
    ├── 前台助理
    └── 清潔/庶務</pre>
<h2>醫師的雙重角色</h2>
<table><tr><th>面向</th><th>職責</th></tr>
<tr><td>醫病關係</td><td>提供專業診療技術、應對患者各種需求、符合社會對醫師的期待</td></tr>
<tr><td>診所經營</td><td>為診所帶來穩定業績、治療時適時介紹其他療程、建立個人品牌形象</td></tr></table>
<div class="callout callout-note"><div class="callout-title">💡 核心觀念</div>醫師當然要有專業，但又不能只有醫療專業。</div>
<h2>SOP 文件層級</h2>
<div class="pyramid">
<div class="pyramid-row"><div class="pyramid-block" style="background:#162028;width:180px">QM 管理手冊</div></div>
<div class="pyramid-row"><div class="pyramid-block" style="background:#2D4A55;width:260px">QP 人員管理作業程序</div></div>
<div class="pyramid-row"><div class="pyramid-block" style="background:#3A5562;width:340px">WSOP 各站工作程序</div></div>
<div class="pyramid-row"><div class="pyramid-block" style="background:#7A98A4;width:420px">CK 日常 Checklist + 再考核表</div></div>
</div>`
},

 desc:'招募原則、到職訓練、試用期考核、晉升路徑、離職流程',
 content:`

{id:'QP-02', cat:'QP', title:'員工手冊', badge:'badge-qp',
 desc:'班表、請假規定、服裝儀容、保密義務、緊急狀況',
 content:`
<h2>請假制度</h2>
<table><tr><th>假別</th><th>規定</th></tr>
<tr><td>特休</td><td>依年資依法給予（1年：3天；2年：7天；3年：10天…）</td></tr>
<tr><td>病假</td><td>每年 30 天，半薪；超過 3 日需就醫證明</td></tr>
<tr><td>事假</td><td>每年 14 天，無薪</td></tr>
<tr><td>生理假</td><td>每月 1 天，半薪</td></tr>
<tr><td>婚假</td><td>8 天，全薪</td></tr>
<tr><td>喪假</td><td>依親疏遠近 3–8 天，全薪</td></tr></table>
<h2>服裝儀容</h2>
<table><tr><th>項目</th><th>規定</th></tr>
<tr><td>工作服</td><td>診所提供，每日整潔穿著，不可私自改裝</td></tr>
<tr><td>頭髮</td><td>工作中需束起，不染誇張髮色</td></tr>
<tr><td>飾品</td><td>進入診療區禁止戴戒指、手鐲（感染控制要求）</td></tr>
<tr><td>指甲</td><td>跟診人員不可留長指甲、不可貼假甲</td></tr>
<tr><td>鞋子</td><td>包頭鞋，不可穿拖鞋或涼鞋</td></tr></table>
<h2>行為規範</h2>
<h3>對患者</h3>
<ul>
<li>任何時候保持禮貌、耐心</li>
<li>不在候診區討論其他患者病情或費用</li>
<li>不私下收受患者紅包（超過 NT$200 者須告知主管）</li>
<li>患者個資絕對保密</li></ul>
<h2>保密義務</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 離職後 2 年內仍適用</div>不得洩露：患者名單/病歷、內部營運數據、SOP 文件、員工薪資與人事資訊。違反者診所保留法律追訴權。</div>
<h2>緊急狀況速查</h2>
<table><tr><th>情況</th><th>處理方式</th></tr>
<tr><td>患者暈厥</td><td>立即通知醫師，啟動急救程序</td></tr>
<tr><td>針扎事件</td><td>立即沖水 15 分鐘 → 通知主管 → 填報告 → 就醫</td></tr>
<tr><td>火災</td><td>通知疏散 → 撥打 119 → 不可乘電梯</td></tr>
<tr><td>患者抱怨</td><td>不爭辯，立即安撫 → 通知主管處理</td></tr></table>`
},

{id:'QP-04', cat:'QP', title:'教育訓練計畫', badge:'badge-qp',
 ver:'v1.0', date:'2026-09-13',
 desc:'分階培訓、客製化教材、互動式課程、30/60/90 帶訓檢核',
 content:`
<div class="callout callout-note"><div class="callout-title">📌 診所就是教室</div>客製化教材、互動式課程、加深團隊共識。訓練不是到職第一週講完就結束，而是有階段、有節點、有人負責。</div>
<h2>一、分階培訓計畫</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 用「幾週內要能獨立完成什麼」定義通關標準</div><strong>訓練才有終點，員工也才知道自己走到哪裡。</strong></div>
<table><tr><th>階段</th><th>期間</th><th>通關標準（「能獨立完成什麼」）</th></tr>
<tr><td>新進助理</td><td>第 1–4 週</td><td>能獨立完成器械準備、基本跟診、消毒室流程</td></tr>
<tr><td>進階助理</td><td>第 2–3 個月</td><td>能獨立跟完植牙／牙周手術、處理技工單</td></tr>
<tr><td>諮詢師</td><td>依編制</td><td>能獨立完成自費療程諮詢與費用說明</td></tr>
<tr><td>櫃檯</td><td>第 1–2 個月</td><td>能獨立完成掛號、收費、預約、電話應對</td></tr></table>
<ul class="checklist">
<li><input type="checkbox"><label>各階段通關標準書面化</label></li>
<li><input type="checkbox"><label>每位新人到職時拿到自己的培訓路徑表</label></li>
</ul>
<h2>二、客製化教材</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 不要用廠商的通用教材取代</div>教材要用<strong>自己診所的器械、自己的系統、自己的空間</strong>拍。通用教材教不了「我們家的滅菌鍋按哪顆」。</div>
<ul class="checklist">
<li><input type="checkbox"><label>器械準備教材（各療程器械盤照片 + 說明）</label></li>
<li><input type="checkbox"><label>系統操作影音（掛號、預約、收費、病歷登錄）</label></li>
<li><input type="checkbox"><label>空間與動線說明（消毒室單向流動、耗材存放位置）</label></li>
<li><input type="checkbox"><label>各療程跟診 SOP（對應 WSOP-04）</label></li>
</ul>
<h2>三、互動式課程</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 單向講述的效率極低</div><strong>讓助理演一次「病人」，往後的溝通品質會明顯不同。</strong>角色互換是最便宜也最有效的訓練工具 — 不用教材、不用場地，只要排進晨會。</div>
<table><tr><th>情境</th><th>演練重點</th></tr>
<tr><td>初診接待到離院</td><td>全流程動線與交接</td></tr>
<tr><td>自費療程諮詢</td><td>話術、費用說明（WSOP-09）</td></tr>
<tr><td>患者抱怨</td><td>分級處理與情緒應對（WSOP-08）</td></tr>
<tr><td>緊急醫療狀況</td><td>昏厥、過敏性休克應變（WSOP-07）</td></tr>
<tr><td>電話預約</td><td>應答、改約、失聯處理</td></tr></table>
<h2>四、帶訓制度與考核節點</h2>
<div class="callout callout-danger"><div class="callout-title">🚫 避免「大家一起教」</div><strong>「大家一起教」通常等於沒有人教。</strong>每位新人指定<strong>一位</strong>帶訓者，責任才會落地。</div>
<table><tr><th>節點</th><th>檢核內容</th><th>執行者</th></tr>
<tr><td><strong>30 天</strong></td><td>基本流程熟悉度、態度與配合度、是否續用</td><td>帶訓者 + 主管</td></tr>
<tr><td><strong>60 天</strong></td><td>獨立作業能力、錯誤率</td><td>帶訓者 + 主管</td></tr>
<tr><td><strong>90 天</strong></td><td>通關標準達成、正式任用與定薪</td><td>主管 + 院長</td></tr></table>
<ul class="checklist">
<li><input type="checkbox"><label>指定專責帶訓者</label></li>
<li><input type="checkbox"><label>每個節點有書面檢核表與面談紀錄</label></li>
<li><input type="checkbox"><label>結果連動獎金與考核制度（QP-03）</label></li>
</ul>
<div class="callout callout-tip"><div class="callout-title">💡 帶訓者的獎勵</div><strong>指定專責帶訓者，並給予相應時數獎勵。</strong>帶訓是額外工作量，沒有對應報酬就不會有人認真帶。</div>`
},
{id:'WSOP-01', cat:'WSOP', title:'開診流程', badge:'badge-wsop',
 desc:'09:30–10:00 開診前六大步驟',
 content:`
<h2>開診 SOP（09:30–10:00）</h2>
<h3>1. 到診打卡（09:30）</h3>
<ul class="checklist" id="chk-wsop01-1">
<li><input type="checkbox"><label>打卡確認到班時間</label></li>
<li><input type="checkbox"><label>換上工作服</label></li></ul>
<h3>2. 環境整理（09:30–09:45）</h3>
<ul class="checklist" id="chk-wsop01-2">
<li><input type="checkbox"><label>候診區：椅面擦拭、雜誌整理、飲水機確認</label></li>
<li><input type="checkbox"><label>前台區：桌面整理、收費台清潔</label></li>
<li><input type="checkbox"><label>廁所：確認清潔、補充衛生紙、洗手乳</label></li>
<li><input type="checkbox"><label>診療室：治療椅擦拭（椅面、把手、燈桿）</label></li>
<li><input type="checkbox"><label>滅菌室：確認昨日滅菌包已備妥</label></li></ul>
<h3>3. 設備開機（09:40）</h3>
<ul class="checklist" id="chk-wsop01-3">
<li><input type="checkbox"><label>開啟電腦、掛號系統登入</label></li>
<li><input type="checkbox"><label>確認預約系統當日班表</label></li>
<li><input type="checkbox"><label>開啟 X 光設備（暖機）</label></li>
<li><input type="checkbox"><label>開啟診療椅電源、吸唾器、空壓機</label></li></ul>
<h3>4. 耗材確認與補充（09:45）</h3>
<ul class="checklist" id="chk-wsop01-4">
<li><input type="checkbox"><label>診療椅旁耗材補充（紙巾、頭套、棉捲、吸管）</label></li>
<li><input type="checkbox"><label>手術室器械台耗材確認</label></li>
<li><input type="checkbox"><label>依診別準備器械包</label></li>
<li><input type="checkbox"><label>確認今日技工單／補給單是否就位</label></li></ul>
<h3>5. 行政確認（09:50）</h3>
<ul class="checklist" id="chk-wsop01-5">
<li><input type="checkbox"><label>確認當日預約名單與療程</label></li>
<li><input type="checkbox"><label>確認未完成技工單回診狀況</label></li>
<li><input type="checkbox"><label>確認當日醫師排班無異動</label></li></ul>
<h3>6. 開門迎診（10:00）</h3>
<ul class="checklist" id="chk-wsop01-6">
<li><input type="checkbox"><label>診所大門解鎖、招牌燈開啟</label></li>
<li><input type="checkbox"><label>前台助理就位，準備接待第一位病患</label></li></ul>`
},
{id:'WSOP-02', cat:'WSOP', title:'收診流程', badge:'badge-wsop',

<li><input type="checkbox"><label>電腦系統登出、關機</label></li>

<li><input type="checkbox"><label>門窗鎖好，最後離開者打卡上鎖</label></li></ul>`
},
{id:'WSOP-03', cat:'WSOP', title:'前台接待流程', badge:'badge-wsop',
 desc:'預約管理、到診接待、候診、收費、離院追蹤及話術',
 content:`
<h2>患者接觸點全流程</h2>
<pre>線上搜尋 → 預約 → 到診接待 → 候診 → 就診 → 收費 → 離院追蹤</pre>
<h2>一、預約管理</h2>
<h3>電話預約問候語</h3>
<div class="callout callout-tip"><div class="callout-title">標準話術</div>「您好，OO牙科，我是XXX，請問有什麼需要幫忙的？」<br>結束語：「感謝您的預約，[日期][時間] 我們等您，再見。」</div>
<h2>二、到診接待</h2>
<h3>初診</h3>
<ul class="checklist" id="chk-wsop03-1">
<li><input type="checkbox"><label>熱情問候，確認姓名與預約時段</label></li>
<li><input type="checkbox"><label>請填寫初診基本資料表</label></li>
<li><input type="checkbox"><label>告知候診約需等待時間</label></li>
<li><input type="checkbox"><label>帶至候診區就座，提供飲水</label></li></ul>
<h2>三、收費結帳</h2>
<ul class="checklist" id="chk-wsop03-2">
<li><input type="checkbox"><label>確認今日治療項目</label></li>
<li><input type="checkbox"><label>告知費用明細（健保部分負擔 + 自費分開說明）</label></li>
<li><input type="checkbox"><label>收取費用，開立收據</label></li>
<li><input type="checkbox"><label>告知下次預約並登錄系統</label></li></ul>
<h2>四、常用話術</h2>
<table><tr><th>情境</th><th>建議話術</th></tr>
<tr><td>費用較高時</td><td>「這個療程費用是 $X，我可以幫您說明明細，有任何問題也可以問醫師。」</td></tr>
<tr><td>患者猶豫</td><td>「完全沒關係，您可以帶資料回去考慮，有問題隨時傳訊息。」</td></tr>
<tr><td>等太久道歉</td><td>「非常抱歉讓您久等了，醫師目前正在處理一個需要多一點時間的療程。」</td></tr></table>`
},
{id:'WSOP-04', cat:'WSOP', title:'看診中助理流程', badge:'badge-wsop',
 desc:'診前準備、診中配合、診後整理、各療程器械速查表',
 content:`
<h2>一、診前準備</h2>
<ul class="checklist" id="chk-wsop04-1">
<li><input type="checkbox"><label>確認今日療程預約清單（與前台核對）</label></li>
<li><input type="checkbox"><label>依療程準備對應器械包</label></li>

<h2>三、各療程器械準備速查</h2>
<table><tr><th>療程</th><th>器械包</th><th>特別耗材</th></tr>
<tr><td>初診檢查</td><td>基本檢查包（探針、口鏡、鑷子）</td><td>X 光片</td></tr>
<tr><td>洗牙</td><td>洗牙頭、拋棄式頭套</td><td>氟化物（視需要）</td></tr>
<tr><td>補牙</td><td>充填器械組</td><td>樹脂色號、光固化燈</td></tr>
<tr><td>根管治療</td><td>根管器械組、橡皮障</td><td>各號銼刀、沖洗液</td></tr>
<tr><td>拔牙</td><td>拔牙鉗組、骨膜剝離器</td><td>局麻藥、縫線</td></tr>
<tr><td>植牙</td><td>手術包、植牙器械盒</td><td>植體（確認規格）</td></tr>

{id:'WSOP-05', cat:'WSOP', title:'耗材盤點流程', badge:'badge-wsop',
 ver:'v2.0', date:'2026-09-13',
 desc:'四步採購、庫存三軸、每日補充／每週盤點／每月結算、植體追蹤',
 content:`
<div class="callout callout-note"><div class="callout-title">📌 兩套方法</div><strong>開業前的採購用「四步採購」，開業後的管理用「三軸庫存」。</strong></div>
<h2>開業前：四步採購</h2>
<h3>STEP 1 依架構分類設定類別</h3>
<p>按<strong>區域、科別、站別</strong>建立分類架構。</p>
<div class="callout callout-tip"><div class="callout-title">💡</div><strong>先有分類架構，採購清單才不會變成一張看不完的長表。</strong></div>
<h3>STEP 2 列出採購品項</h3>
<p><strong>廠牌、名稱、規格</strong>逐項列明。</p>
<div class="callout callout-tip"><div class="callout-title">💡</div><strong>規格寫清楚才能真正比價。</strong>「複合樹脂一支」跟「A2 色號 4g 特定廠牌」是兩回事。</div>
<h3>STEP 3 計算採購數量</h3>
<p>依<strong>門診量、動線與消毒週期</strong>估算。</p>
<div class="callout callout-warn"><div class="callout-title">⚠ 兩個時間點</div>
<ul><li>建議在<strong>開業前兩個月下訂</strong>，並注意<strong>廠商開業價的活動期限</strong></li>
<li>數量<strong>分兩階段評估</strong>：先備<strong>開幕首月用量</strong>，再依實際門診量調整</li>
<li>開幕前 <strong>2–3 週</strong>完成進場</li></ul></div>
<h3>STEP 4 廠商評估</h3>
<p>比<strong>品質</strong>、比<strong>價格</strong>、並確認<strong>交易條件</strong>（付款方式、最低訂購量、退換貨、送貨頻率）。</p>
<div class="callout callout-danger"><div class="callout-title">🚫 供應來源</div>牙材耗材建議<strong>至少維持兩家供應來源</strong>。單一供應商斷貨時，診所不能跟著停診。</div>
<h3>開業前採購檢核</h3>
<ul class="checklist">
<li><input type="checkbox"><label>分類架構建立（區域 / 科別 / 站別）</label></li>
<li><input type="checkbox"><label>採購品項表完成（廠牌、名稱、規格逐項）</label></li>
<li><input type="checkbox"><label>首月用量估算完成（依預估門診量 + 消毒週期）</label></li>
<li><input type="checkbox"><label>各品項至少兩家廠商比價與交易條件確認</label></li>
<li><input type="checkbox"><label>開業前 2 個月下訂（確認開業價活動期限）</label></li>
<li><input type="checkbox"><label>開幕前 2–3 週進場、驗收、上架</label></li>
</ul>
<h2>開業後：庫存管理三軸</h2>
<table><tr><th>軸</th><th>做法</th></tr>
<tr><td><strong>週期盤點</strong></td><td>每日補充 / 每週盤點 / 每月結算</td></tr>
<tr><td><strong>ABC 分類</strong></td><td>A 高週轉、B 中週轉、C 低週轉／高單價</td></tr>
<tr><td><strong>出入庫管理</strong></td><td>FIFO / FEFO / 雙堆法</td></tr></table>
<h3>出入庫三法</h3>
<table><tr><th>方法</th><th>全稱</th><th>適用</th></tr>
<tr><td><strong>FIFO</strong></td><td>First In, First Out（先進先出）</td><td>一般耗材，依入庫順序使用</td></tr>
<tr><td><strong>FEFO</strong></td><td>First Expired, First Out（先到期先出）</td><td><strong>有效期敏感品項</strong>：麻醉藥、樹脂、黏著劑、印模材</td></tr>
<tr><td><strong>雙堆法</strong></td><td>Two-bin system</td><td>高週轉小品項：分兩堆，第一堆用完即觸發補貨</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">⚠ 效期品項用 FEFO，不是 FIFO</div>先進的不一定先過期。麻藥、樹脂、根管沖洗液這類要看<strong>效期</strong>排序，不是看入庫日。</div>
<div class="callout callout-tip"><div class="callout-title">💡 高低價值品項的策略相反</div>
<ul><li><strong>高價值牙材</strong>（植體、骨粉、口掃耗材）→ <strong>重點管理</strong>，逐批追蹤，不超量備存</li>
<li><strong>低價值品項</strong>（手套、棉捲、紙巾）→ 可評估<strong>大量訂貨降低成本</strong></li></ul></div>
<h2>耗材三層管控</h2>
<table><tr><th>層級</th><th>對象</th><th>頻率</th></tr>
<tr><td>每日補充</td><td>A 類高週轉消耗品</td><td>每日開診前 + 收診後</td></tr>
<tr><td>每週盤點</td><td>A + B 類</td><td>每週一</td></tr>
<tr><td>每月結算</td><td>全倉庫 A+B+C 類</td><td>每月最後工作日</td></tr></table>
<h2>A 類每日確認項目（安全庫存）</h2>
<table><tr><th>品項</th><th>最低安全庫存</th></tr>
<tr><td>手套（各尺寸）</td><td>2 盒/尺寸</td></tr>
<tr><td>棉捲</td><td>100 支</td></tr>
<tr><td>吸管</td><td>各 50 支</td></tr>
<tr><td>頭套</td><td>50 個</td></tr>
<tr><td>局部麻醉藥</td><td>20 劑</td></tr>
<tr><td>銳器桶</td><td>10 個/月</td></tr></table>
<h2>植體特別管理</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 植體逐批追蹤</div>每支植體入庫時記錄：品牌、型號、規格、批號、效期。植入後立即填入手術記錄單，批號需能對應回患者病歷日期。</div>
<h2>月度耗材成本率</h2>
<p>目標：耗材成本 / 月營收 ≤ <strong>10–15%</strong>，超出需查核異常品項。</p>`
},
{id:'WSOP-06', cat:'WSOP', title:'技工單處理流程', badge:'badge-wsop',
 desc:'出貨、入貨核對、退件處理、逾期假牙管理',
 content:`
<h2>技工單生命週期</h2>
<pre>確認需求 → 填寫技工單 → 準備模型/數位檔 → 打包出貨
  ↓ 出貨登記 → 技工所製作 → 送回入貨
  ↓ 核對品項 → 通知患者 → 試戴/裝戴 → 歸檔</pre>
<h2>技工單必填欄位</h2>
<table><tr><th>欄位</th><th>說明</th></tr>
<tr><td>患者姓名 + 病歷號</td><td>確認唯一性</td></tr>
<tr><td>製作品項</td><td>詳細描述（如：#14 PFM Crown，鈦合金底層）</td></tr>
<tr><td>顏色/色號</td><td>使用 Vita 色卡，附照片更佳</td></tr>
<tr><td>Implant Crown 特別注意</td><td>植體品牌、型號、掃描體型號、連接方式</td></tr>
<tr><td>預計回件日期</td><td>與技工所確認後填寫</td></tr></table>
<h2>入貨核對</h2>
<ul class="checklist" id="chk-wsop06-1">
<li><input type="checkbox"><label>患者姓名/病歷號正確</label></li>
<li><input type="checkbox"><label>品項與技工單一致</label></li>
<li><input type="checkbox"><label>顏色/色號符合要求</label></li>
<li><input type="checkbox"><label>外觀無明顯瑕疵（裂縫、氣泡、邊緣不整）</label></li>
<li><input type="checkbox"><label>技工所送件收據簽收存檔</label></li></ul>
<h2>逾期假牙處理</h2>
<table><tr><th>狀況</th><th>處理</th></tr>
<tr><td>超過 30 天未取件</td><td>主動致電確認意願</td></tr>
<tr><td>超過 3 個月未取件</td><td>通知院長，書面告知保存期限</td></tr></table>`
},
{id:'WSOP-07', cat:'WSOP', title:'緊急醫療處置 SOP', badge:'badge-wsop',
 desc:'昏厥、過敏性休克、低血糖、高血壓危象、CPR 五大情境',
 content:`
<div class="callout callout-danger"><div class="callout-title">🚨 急救設備位置（開業前填入）</div>
AED：＿＿＿＿ | 急救藥物箱：＿＿＿＿ | 最近急診室：＿＿＿＿（約 ＿＿ 分鐘）</div>
<h2>情境一：血管迷走性昏厥（最常見）</h2>
<p><strong>辨識</strong>：臉色蒼白、冒冷汗、噁心、脈搏微弱</p>
<ul class="checklist" id="chk-wsop07-1">
<li><input type="checkbox"><label>立即讓患者平躺，雙腳抬高</label></li>
<li><input type="checkbox"><label>鬆開頸部及胸部衣物</label></li>
<li><input type="checkbox"><label>意識清醒時提供糖分（糖果、果汁）</label></li>
<li><input type="checkbox"><label>每 3–5 分鐘測量血壓、脈搏</label></li>
<li><input type="checkbox"><label>通常 5–10 分鐘自行恢復，恢復後休息 15–30 分鐘</label></li></ul>
<h2>情境二：過敏性休克（Anaphylaxis）</h2>
<div class="callout callout-danger"><div class="callout-title">辨識：喉嚨緊縮、呼吸困難、低血壓、意識改變——三者之一即須立即處置</div></div>
<ul class="checklist" id="chk-wsop07-2">
<li><input type="checkbox"><label>立即呼叫 119</label></li>
<li><input type="checkbox"><label>Epinephrine 0.3mg IM（大腿外側）立即注射</label></li>
<li><input type="checkbox"><label>5–15 分鐘無改善可重複第二劑</label></li>
<li><input type="checkbox"><label>給氧、監測生命徵象直到救護車到達</label></li></ul>
<h2>情境三：低血糖</h2>
<p><strong>有意識可吞嚥</strong>：給予 15–20g 糖分（果汁 150mL / 葡萄糖錠 4 粒）→ 等 15 分鐘重新評估</p>
<p><strong>意識不清</strong>：立即呼叫 119，不可強迫口服，考慮 Glucagon 肌注</p>
<h2>情境四：心臟驟停（CPR）</h2>
<pre>呼叫 119 + 拿 AED（同時進行）
  ↓
C — 胸外按壓：深度 5cm，速率 100–120次/分，30:2
A — 打開呼吸道（仰頭抬下巴）
B — 人工呼吸（每次 1 秒）
  ↓
AED 到達 → 開機 → 貼電極片 → 分析 → 電擊
  ↓
持續 CPR 直到救護車到達</pre>
<h2>角色分工</h2>
<table><tr><th>角色</th><th>職責</th></tr>
<tr><td>醫師</td><td>主導 CPR，指揮全程</td></tr>
<tr><td>跟診助理 1</td><td>執行胸外按壓（輪替）</td></tr>
<tr><td>跟診助理 2</td><td>拿 AED、操作 AED</td></tr>
<tr><td>前台</td><td>打 119、清場候診區、引導救護車</td></tr></table>
<div class="callout callout-tip"><div class="callout-title">💡 每半年模擬演練一次</div>隨機選定情境，計時從發現到正確處置的時間；確認每位員工知道急救設備位置；確認 AED 電極片、急救藥物效期。</div>`
},
{id:'WSOP-08', cat:'WSOP', title:'患者投訴處理 SOP', badge:'badge-wsop',
 desc:'L1–L3 分級應對、線上負評回應格式、投訴記錄表',
 content:`
<h2>投訴分級</h2>
<table><tr><th>等級</th><th>情境</th><th>處理人</th></tr>
<tr><td>L1：一般抱怨</td><td>等太久、費用疑問、態度不滿</td><td>前台助理</td></tr>
<tr><td>L2：服務糾紛</td><td>療效不如預期、要求重做或退費</td><td>診所主管</td></tr>
<tr><td>L3：醫療糾紛</td><td>疑似醫療疏失、身體傷害、法律威脅</td><td>院長 + 法律顧問</td></tr></table>
<h2>L1 黃金原則</h2>
<div class="callout callout-tip"><div class="callout-title">先處理情緒，再處理問題</div>
1. 不爭辯：「您說得對，這讓您感到不方便，非常抱歉。」<br>
2. 引導至私下空間：「方便請您到這邊，我們找個地方好好聊聊。」<br>
3. 傾聽完整，不中途打斷<br>
4. 確認核心訴求<br>
5. 結尾：「感謝您告訴我們，這對我們改善服務非常重要。」</div>
<h2>L3 醫療糾紛第一原則</h2>
<div class="callout callout-danger"><div class="callout-title">🚨 不承認疏失、不當場退費、不在情緒激動時做任何承諾</div></div>
<ul class="checklist" id="chk-wsop08-1">
<li><input type="checkbox"><label>完整保存所有相關病歷、X 光、知情同意書（不得修改）</label></li>
<li><input type="checkbox"><label>聯繫診所法律顧問或牙醫師公會調解委員會</label></li>
<li><input type="checkbox"><label>必要時啟動醫療責任保險理賠程序</label></li></ul>
<h2>線上負評標準回覆</h2>
<div class="callout callout-note"><div class="callout-title">📋 複製使用</div>感謝您的回饋。<br>我們對您的體驗感到非常遺憾，患者的感受對我們來說非常重要。由於診療相關細節涉及個人隱私，我們無法在此詳述，但非常歡迎您直接與我們聯繫，我們會認真傾聽並盡力協助解決。<br>[診所名稱] 敬上</div>`
},
{id:'WSOP-09', cat:'WSOP', title:'自費療程諮詢流程', badge:'badge-wsop',
 desc:'植牙/矯正/美學話術、費用說明結構、30天追蹤機制',
 content:`
<div class="callout callout-note"><div class="callout-title">💡 核心心態</div>不是推銷，是衛教。讓患者理解需求、主動決定。核心是教育，不是說服。</div>
<h2>植牙諮詢三步驟</h2>
<h3>Step 1：建立問題意識</h3>
<div class="callout callout-tip"><div class="callout-title">話術參考</div>「您的 X 光片顯示 #XX 號牙齒缺牙已經 X 年了，您有沒有發現旁邊的牙齒好像有點往這邊傾斜？長期下來對咬合和骨頭都會有影響。」</div>
<h3>Step 2：說明選項（不只推植牙）</h3>
<table><tr><th>選項</th><th>優點</th><th>缺點</th></tr>
<tr><td>活動假牙</td><td>費用最低</td><td>舒適度與功能有限</td></tr>
<tr><td>牙橋</td><td>固定式，功能較好</td><td>需要磨鄰牙</td></tr>
<tr><td>植牙</td><td>最接近天然牙，長期維護成本最低</td><td>費用較高，需手術</td></tr></table>
<h3>Step 3：費用交給前台說明</h3>
<p>醫師不報價：「費用部分我請前台同事為您說明」→ 前台提供書面估價單</p>
<h2>費用說明話術</h2>
<table><tr><th>情境</th><th>話術</th></tr>
<tr><td>患者說「太貴了」</td><td>「我理解，這確實是一筆費用。醫師推薦這個療程是因為 [臨床理由]。」</td></tr>
<tr><td>患者說「再考慮看看」</td><td>「完全沒問題。我可以把今天的說明整理成文字傳給您。」→ 立即傳送衛教資料</td></tr></table>
<h2>追蹤節點（最多 3 次）</h2>
<table><tr><th>時間點</th><th>動作</th></tr>
<tr><td>諮詢後 3 天</td><td>傳送衛教資料</td></tr>
<tr><td>諮詢後 7 天</td><td>主動詢問是否有問題</td></tr>
<tr><td>諮詢後 30 天</td><td>最後一次追蹤</td></tr>
<tr><td>30 天後無回應</td><td>停止主動追蹤，待患者自行回診時再提起</td></tr></table>`
},
{id:'WSOP-10', cat:'WSOP', title:'月度財務管理 SOP', badge:'badge-wsop',

{id:'WSOP-11', cat:'WSOP', title:'OMO 行銷執行 SOP', badge:'badge-wsop',
 desc:'GMB 維護、社群月曆、廣告投放、新患者來源追蹤、口碑行銷',
 content:`
<h2>OMO 行銷架構</h2>
<pre>線上搜尋（Google / IG / FB）
        ↓
品牌第一印象（GMB 評論、社群內容、官網）
        ↓
預約聯繫（電話 / LINE / 線上表單）
        ↓
線下就診體驗（接待 / 診療 / 收費）
        ↓
滿意後口碑回流（Google 評論 / 轉介紹）</pre>
<h2>核心平台優先級</h2>
<table><tr><th>平台</th><th>功能</th><th>優先級</th></tr>
<tr><td>Google My Business</td><td>在地搜尋曝光、評論管理</td><td>★★★ 最高</td></tr>
<tr><td>Instagram</td><td>品牌形象、衛教內容</td><td>★★★</td></tr>
<tr><td>LINE 官方帳號</td><td>患者溝通、預約提醒</td><td>★★★</td></tr>
<tr><td>Facebook</td><td>年長患者觸及、廣告投放</td><td>★★</td></tr>
<tr><td>診所官網</td><td>SEO、轉換頁面</td><td>★★</td></tr></table>
<h2>Google My Business 每週任務</h2>
<ul class="checklist" id="chk-wsop11-gmb">
<li><input type="checkbox"><label>確認 GMB 基本資訊正確（電話、地址、營業時間）</label></li>
<li><input type="checkbox"><label>回覆本週新評論（目標：24 小時內）</label></li>
<li><input type="checkbox"><label>上傳 1–2 張診所實拍照片</label></li>
<li><input type="checkbox"><label>（每月）發布 GMB 貼文 1–2 篇</label></li>
<li><input type="checkbox"><label>（每月）查看 GMB 洞察數據並記錄</label></li></ul>
<h2>GMB 評論回覆規範</h2>
<table><tr><th>星級</th><th>回覆策略</th></tr>
<tr><td>5 星</td><td>感謝 + 歡迎下次回診，可提及療程（不透露個資）</td></tr>
<tr><td>3–4 星</td><td>感謝回饋 + 說明改善之處 + 邀請再給機會</td></tr>
<tr><td>1–2 星</td><td>依投訴處理 SOP 標準回覆，私訊跟進</td></tr></table>
<div class="callout callout-warn"><div class="callout-title">⚠ 個資合規</div>回覆評論時<strong>禁止</strong>提及患者姓名、病情、治療細節（違反個資法）。</div>
<h2>社群媒體內容月曆</h2>
<table><tr><th>週次</th><th>主題方向</th><th>建議格式</th></tr>
<tr><td>第 1 週</td><td>衛教知識（刷牙、飲食、口腔保健）</td><td>圖文 / Reels 15–30 秒</td></tr>
<tr><td>第 2 週</td><td>診所日常 / 團隊介紹</td><td>短影片 / Story</td></tr>
<tr><td>第 3 週</td><td>療程說明（植牙、矯正、美白）</td><td>懶人包圖卡</td></tr>
<tr><td>第 4 週</td><td>節氣 / 節日 / 活動資訊</td><td>圖文</td></tr></table>
<h2>發文合規規範</h2>
<ul>
<li>IG/FB 每週 2–3 篇正文 + 每日 1–2 則 Story</li>
<li>LINE 群發：每月 ≤ 2 次</li>
<li>禁止：療效保證、誇大療效、攻擊競爭對手</li>
<li>患者照片需取得書面授權，禁止洩露可識別個資</li>
<li>使用診所實拍，禁用無版權圖庫</li></ul>
<h2>廣告投放 SOP</h2>
<h3>Google 搜尋廣告</h3>
<ul>
<li>關鍵字：[診所名稱]、[區域]+牙醫、[區域]+植牙/矯正</li>
<li>地理目標：診所半徑 5 km 核心，延伸 10 km</li>
<li>轉換追蹤：電話點擊、LINE 連結點擊、表單送出</li></ul>
<h3>Meta 廣告（FB / IG）</h3>
<ul>
<li>受眾：診所半徑 5–8 km，25–55 歲</li>
<li>開業前 3 個月：品牌曝光（觸及最大化）</li>
<li>開業後：轉換導向（預約點擊 / LINE 加入）</li>
<li>每 4–6 週更換素材，同時投放 ≥ 2 組 A/B 測試</li></ul>
<h2>廣告效益月報目標</h2>
<table><tr><th>指標</th><th>目標值</th></tr>
<tr><td>GMB 電話撥打</td><td>≥ 50 次/月</td></tr>
<tr><td>廣告點擊率（CTR）</td><td>≥ 3%</td></tr>
<tr><td>廣告 CPC</td><td>≤ NT$30</td></tr>
<tr><td>廣告帶來預約數</td><td>≥ 20 件/月</td></tr>
<tr><td>LINE 新增好友</td><td>≥ 30 人/月</td></tr>
<tr><td>線上來源新患者比例</td><td>≥ 40%</td></tr>
<tr><td>患者獲取成本（CAC）</td><td>≤ NT$2,000</td></tr>
<tr><td>行銷費用率</td><td>≤ 5% 月營收</td></tr></table>
<h2>新患者來源追蹤</h2>
<p>前台於初診掛號時詢問：<strong>「請問您是怎麼知道我們診所的呢？」</strong></p>
<ul>
<li>Google 搜尋 / Google 地圖</li>
<li>Instagram / Facebook</li>
<li>LINE 官方帳號</li>
<li>親友介紹</li>
<li>路過 / 招牌</li>
<li>其他</li></ul>
<h2>Google 評論邀請腳本</h2>
<p>時機：療程完成、患者表示滿意、離院前</p>
<pre>「很高興您今天的治療順利完成！
如果您有空，可以幫我們在 Google 上留個評價嗎？
對我們真的幫助很大，謝謝您！」
→ 同時傳送 Google 評論短連結</pre>
<div class="callout callout-note"><div class="callout-title">📌 合規提醒</div>不得以金錢或折扣換取評論（違反消費者保護法及 Google 政策）。衛教小禮品（牙刷、牙膏）可作為感謝，但不以此換取評論。</div>
<h2>行銷月度回顧 Checklist（每月 25 日）</h2>
<ul class="checklist" id="chk-wsop11-review">
<li><input type="checkbox"><label>彙整 GMB 數據、廣告報表、LINE 新增好友數</label></li>
<li><input type="checkbox"><label>統計新患者來源比例</label></li>
<li><input type="checkbox"><label>回顧本月社群內容表現（觸及、互動率）</label></li>
<li><input type="checkbox"><label>調整下月內容月曆與廣告預算</label></li>
<li><input type="checkbox"><label>呈報院長：行銷花費 vs. 新患者數（CAC）</label></li></ul>`
},
{id:'WSOP-12', cat:'WSOP', title:'患者回診追蹤 SOP', badge:'badge-wsop',
 desc:'回診週期、預約提醒、追蹤話術、回診率 KPI、失聯患者處理',
 content:`
<h2>回診追蹤系統架構</h2>
<pre>治療結束
    ↓
預約下次回診（當下）← 最佳時機，成功率最高
    ↓
   有預約               未預約
    ↓                      ↓
預約提醒               主動追蹤聯繫
（前 1 天）            （依療程週期）
    ↓                      ↓
   到診                  到診 / 無回應
    ↓                      ↓
下一輪回診預約         最多追蹤 3 次 → 停止</pre>
<div class="callout callout-tip"><div class="callout-title">💡 核心原則</div>當場預約成功率 &gt; 70%，比事後追蹤高出 3 倍。治療結束當下是最佳預約時機。</div>
<h2>各療程回診週期</h2>
<table><tr><th>療程類別</th><th>回診時機</th><th>追蹤節點</th></tr>
<tr><td>洗牙 / 牙周維護</td><td>每 3–6 個月</td><td>到期前 2 週聯繫</td></tr>
<tr><td>一般定期檢查</td><td>每 6–12 個月</td><td>到期前 2 週聯繫</td></tr>
<tr><td>矯正複診</td><td>每 4–8 週</td><td>上次回診時當場預約</td></tr>
<tr><td>植牙術後</td><td>1 週、1 個月、3 個月、6 個月、1 年</td><td>每節點前 3 天提醒</td></tr>
<tr><td>全瓷冠 / 假牙</td><td>1 個月、6 個月、1 年</td><td>每節點前 3 天提醒</td></tr>
<tr><td>根管治療後</td><td>6 個月、1 年</td><td>到期前 2 週聯繫</td></tr>
<tr><td>拔牙術後</td><td>1 週（拆線）</td><td>預約前提醒</td></tr>
<tr><td>牙周手術後</td><td>2 週、1 個月、3 個月</td><td>每節點前 3 天提醒</td></tr>
<tr><td>兒童塗氟</td><td>每 3–6 個月</td><td>到期前 2 週聯繫</td></tr></table>
<h2>主動追蹤時間表（未預約者）</h2>
<table><tr><th>追蹤次數</th><th>時機</th><th>管道</th></tr>
<tr><td>第 1 次</td><td>到期日前 2 週</td><td>LINE 訊息</td></tr>
<tr><td>第 2 次</td><td>到期日前 1 週（無回應）</td><td>電話</td></tr>
<tr><td>第 3 次</td><td>超過到期日 2 週後</td><td>LINE 訊息</td></tr>
<tr><td>停止</td><td>3 次無回應</td><td>系統備註，待患者自行回診</td></tr></table>
<h2>LINE 追蹤訊息範本（第 1 次）</h2>
<pre>[患者姓名] 您好，

這裡是 [診所名稱] 的 [助理姓名]。

上次您於 [日期] 來做了 [療程]，
醫師建議您在這個時間前回診確認：[建議時間]。

請問您最近方便哪個時段來呢？
或是有任何問題也歡迎直接詢問我們 😊</pre>
<h2>電話追蹤話術（第 2 次）</h2>
<pre>「您好，請問是 [患者姓名] 嗎？
 我是 [診所名稱] 的 [姓名]，
 想提醒您上次 [療程] 後的追蹤回診時間到了，
 請問最近有沒有方便的時間過來呢？
 [時段A] 或 [時段B] 都有空檔。」

若對方說忙：
「沒關係，您方便的話再告訴我們就好，
 或是傳 LINE 給我們也可以預約。」</pre>
<h2>術後關心訊息（手術後 1–3 天）</h2>
<pre>[患者姓名] 您好，

昨天的 [植牙/手術] 恢復得還好嗎？

術後 1–2 天有些腫脹和不適是正常的，
如果有持續出血、劇烈疼痛或發燒，
請馬上聯繫我們或到急診就醫。

您的回診預約是 [日期 時間]，
期間若有任何疑問都歡迎傳訊息給我們 🦷</pre>
<h2>特殊情境處理</h2>
<h3>多次爽約患者</h3>
<table><tr><th>爽約次數</th><th>處理方式</th></tr>
<tr><td>第 1 次</td><td>當天致電關心，同時改約</td></tr>
<tr><td>第 2 次</td><td>改約時說明「需事先告知取消」政策</td></tr>
<tr><td>第 3 次以上</td><td>系統備註，需求診當日電話確認後才留位</td></tr></table>
<h3>長期失聯患者（超過 18 個月未回診）</h3>
<pre>「[患者姓名] 您好，
 距離上次回診已經一段時間了，
 口腔健康需要定期維護，
 歡迎來電或傳 LINE 預約，我們期待再次為您服務 😊」</pre>
<p>發送 1 次後無回應 → 停止主動聯繫，等待患者自行回來。</p>
<h2>每月回診率追蹤報表</h2>
<table><tr><th>療程類別</th><th>應回診人數</th><th>實際回診</th><th>回診率</th><th>目標</th></tr>
<tr><td>洗牙 / 牙周維護</td><td></td><td></td><td></td><td>≥ 75%</td></tr>
<tr><td>植牙術後追蹤</td><td></td><td></td><td></td><td>≥ 90%</td></tr>
<tr><td>矯正複診</td><td></td><td></td><td></td><td>≥ 95%</td></tr>
<tr><td>一般追蹤</td><td></td><td></td><td></td><td>≥ 70%</td></tr>
<tr><td><strong>整體回診率</strong></td><td></td><td></td><td></td><td><strong>≥ 75%</strong></td></tr></table>
<h2>回診率低於目標時的改善行動</h2>
<table><tr><th>回診率</th><th>行動</th></tr>
<tr><td>65–74%</td><td>加強 LINE 追蹤，改善訊息內容</td></tr>
<tr><td>55–64%</td><td>增加電話追蹤比例，主管個別 review 案例</td></tr>
<tr><td>&lt; 55%</td><td>全面檢討服務品質，是否有患者不願回來的根本原因</td></tr></table>
<div class="callout callout-note"><div class="callout-title">📊 診所健康指標</div>流失率（12 個月未回診）&lt; 20% 為健康診所；&gt; 40% 需認真檢討服務體驗與診療品質。</div>`
},

{id:'CK-04', cat:'CK', title:'各療程衛教說明單', badge:'badge-ck',
 desc:'洗牙、拔牙、根管、植牙、全瓷冠、矯正、牙周手術、美白術後衛教',
 content:`
<div class="callout callout-tip"><div class="callout-title">💡 使用說明</div>每次療程完成後，跟診助理主動遞給患者，說明「這是今天療程的注意事項，您帶回去參考」。同時可透過 LINE 傳送電子版。</div>
<h2>一、洗牙 / 牙周維護後</h2>
<ul><li>牙齒敏感屬正常，通常 1–3 天內緩解</li>
<li>牙齦輕微出血 1–2 天屬正常，超過 3 天請聯繫診所</li>
<li>當天避免染色食物（咖啡、茶、紅酒）</li>
<li>建議使用牙線 + 牙間刷清潔牙縫</li></ul>
<p><strong>下次回診：</strong>牙周健康者 6 個月、牙周病患者 3 個月</p>
<h2>二、拔牙後</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 術後前 24 小時最重要</div>咬紗布 30–60 分鐘 · 不漱口 · 不吐口水 · 不用吸管 · 不抽菸</div>
<ul><li>冰敷臉頰（20 分鐘敷、20 分鐘休息）</li>
<li>軟食，避免在傷口側咀嚼至少 3–5 天</li>
<li>按時服用止痛藥與抗生素（若有開立）</li></ul>
<p><strong>請立即就醫：</strong>出血超過 2 小時 · 術後 3–4 天疼痛突然加劇（可能 Dry Socket）· 發燒超過 38°C</p>
<h2>三、根管治療</h2>
<ul><li>治療中不要咬硬的東西</li>
<li>暫時填充物若完全脫落，請儘快聯繫診所</li>
<li>完成後<strong>必須製作牙套</strong>保護，否則牙齒容易裂開</li>
<li>術後 2–3 天輕微酸痛屬正常，3 天後仍疼痛或腫脹請回診</li></ul>
<h2>四、植牙術後</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 重要提醒</div>抽菸者骨整合成功率顯著下降，術後至少 2 週禁菸。</div>
<ul><li>咬紗布 30–60 分鐘，冰敷臉頰，頭部稍微墊高睡覺</li>
<li>軟食一週，按時服完抗生素</li>
<li>第二天起可用生理食鹽水輕輕漱口</li></ul>
<table><tr><th>回診時程</th><th>目的</th></tr>
<tr><td>術後 1 週</td><td>拆線 + 確認癒合</td></tr>
<tr><td>術後 1 個月</td><td>確認骨整合初期</td></tr>
<tr><td>術後 3 個月</td><td>X 光確認骨整合</td></tr>
<tr><td>術後 3–6 個月</td><td>取模製作假牙</td></tr>
<tr><td>裝牙後 1 年</td><td>定期追蹤</td></tr></table>
<h2>五、全瓷冠 / 假牙裝戴後</h2>
<ul><li>裝戴後 2 小時避免咬硬的或黏的食物</li>
<li>使用牙線清潔假牙兩側牙縫（橋體下方用牙線穿引器）</li>
<li>避免咬冰塊、骨頭、檳榔等過硬食物</li>
<li>裝戴後 1 個月回診確認咬合，之後每 6–12 個月定期回診</li></ul>
<h2>六、矯正治療</h2>
<h3>傳統矯正</h3>
<ul><li>黏上托架後 3–5 天酸痛屬正常，可吃止痛藥</li>
<li>避免：硬麵包、骨頭、整顆蘋果、爆米花、口香糖</li>
<li>每次刷牙至少 3 分鐘，使用矯正牙刷 + 牙間刷</li>
<li>托架鬆脫或鋼線刺臉頰，請聯繫診所</li></ul>
<h3>隱適美</h3>
<ul><li>每天配戴<strong>至少 22 小時</strong>，只有刷牙和吃東西時取下</li>
<li>取下後立即刷牙再戴回</li>
<li>牙套用清水或清潔錠清洗，<strong>禁用熱水（會變形）</strong></li></ul>
<h2>七、牙周手術後</h2>
<ul><li>冰敷臉頰，軟食，不在手術區咀嚼</li>
<li>抗生素完整服完</li>
<li>第二天起生理食鹽水輕輕漱口，不用電動牙刷直到醫師許可</li>
<li>術後 1–2 週拆線回診</li></ul>
<p><strong>請立即就醫：</strong>出血超過 2 小時 · 腫脹術後 3–4 天持續加重 · 發燒 · 出現膿的味道</p>
<h2>八、美白療程後</h2>
<div class="callout callout-warn"><div class="callout-title">⚠ 術後 48 小時關鍵期</div>避免所有染色飲食：咖啡、茶、紅酒、醬油、咖哩、深色水果、抽菸</div>
<ul><li>牙齒敏感通常 24–48 小時後緩解，可使用抗敏感牙膏</li>
<li>效果通常維持 6–18 個月，依生活習慣而定</li>
<li>定期洗牙有助於維持美白效果</li></ul>`
}
];

// ── Navigation ──────────────────────────────────────────────────
const CATS = {
  home: { label: '首頁', icon: '🏠' },
  PRE:  { label: '開業前期 PRE', icon: '📋' },
  QM:   { label: '管理手冊 QM', icon: '📖' },
  QP:   { label: '人員管理 QP', icon: '👥' },
  WSOP: { label: '各站流程 WSOP', icon: '⚙️' },
  CK:   { label: '日常 Checklist', icon: '✅' }
};

function buildNav() {
  const tree = document.getElementById('nav-tree');
  const grouped = {};
  DOCS.forEach(d => {
    if (!grouped[d.cat]) grouped[d.cat] = [];
    grouped[d.cat].push(d);
  });
  Object.entries(CATS).forEach(([cat, info]) => {
    if (!grouped[cat]) return;
    const sec = document.createElement('div');
    sec.className = 'nav-section';
    if (cat !== 'home') {
      const t = document.createElement('div');
      t.className = 'nav-section-title';
      t.textContent = info.icon + ' ' + info.label;
      sec.appendChild(t);
    }
    grouped[cat].forEach(d => {
      const item = document.createElement('div');
      item.className = 'nav-item' + (d.id === 'HOME' ? ' active' : '');
      item.dataset.id = d.id;
      item.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis">${d.id === 'HOME' ? '🏠 文件總覽' : d.title}</span>` +
        (d.badge ? `<span class="tag">${d.id}</span>` : '');
      item.onclick = () => navigate(d.id);
      sec.appendChild(item);
    });
    tree.appendChild(sec);
  });
}

function navigate(id) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  const doc = DOCS.find(d => d.id === id);
  document.getElementById('doc-title').textContent = id === 'HOME' ? '文件總覽' : `${id} — ${doc.title}`;
  const content = document.getElementById('content');
  if (id === 'HOME') {
    renderHome(content);
  } else {
    renderDoc(content, doc);
  }
  window.scrollTo(0, 0);
}

function renderHome(el) {
  const cats = ['PRE','QM','QP','WSOP','CK'];
  const counts = {};
  cats.forEach(c => counts[c] = DOCS.filter(d => d.cat === c).length);
  el.innerHTML = `
  <div class="home-hero">
    <div class="home-hero-tag">Taiwan Dental Clinic · SOP System</div>
    <h1>牙科診所<br>SOP 文件系統</h1>
    <p>從開業申請到日常營運的完整標準作業程序，共 ${DOCS.length - 1} 份文件，涵蓋法規、人員、流程、財務、緊急應對等各面向。</p>
  </div>
  <div class="home-stats">
    <div class="stat-card"><div class="stat-num">${DOCS.length - 1}</div><div class="stat-label">總文件數</div></div>
    ${cats.map(c => `<div class="stat-card"><div class="stat-num">${counts[c]}</div><div class="stat-label">${CATS[c].label.split(' ')[0]}</div></div>`).join('')}
  </div>
  ${cats.map(cat => `
  <div class="section-header">${CATS[cat].icon} ${CATS[cat].label}</div>
  <div class="doc-grid">
    ${DOCS.filter(d => d.cat === cat).map(d => `
    <div class="doc-card" onclick="navigate('${d.id}')">
      <div class="doc-card-id"><span class="badge ${d.badge}">${d.id}</span></div>
      <div class="doc-card-title">${d.title}</div>
      <div class="doc-card-desc">${d.desc}</div>
    </div>`).join('')}
  </div>`).join('')}`;
}

function renderDoc(el, doc) {
  el.innerHTML = `<div class="doc">
    <h1>${doc.id} — ${doc.title}</h1>
    <div class="meta">
      <span><span class="badge ${doc.badge}">${doc.cat}</span></span>
      <span>版本 ${doc.ver || 'v1.0'}</span>
      <span>${doc.date || '2026-06-28'}</span>
    </div>
    ${doc.content || '<p>內容整理中…</p>'}
  </div>`;
  loadChecks(doc.id);
}

// ── Checklist persistence ────────────────────────────────────────
function loadChecks(docId) {
  const saved = JSON.parse(localStorage.getItem('checks_' + docId) || '{}');
  document.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
    cb.id = 'cb_' + docId + '_' + i;
    const lbl = cb.nextElementSibling;
    if (lbl) lbl.setAttribute('for', cb.id);
    if (saved[i]) cb.checked = true;
    cb.onchange = () => saveChecks(docId);
  });
}

function saveChecks(docId) {
  const state = {};
  document.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
    if (cb.checked) state[i] = true;
  });
  localStorage.setItem('checks_' + docId, JSON.stringify(state));
}

function resetChecks() {
  const active = document.querySelector('.nav-item.active');
  if (!active) return;
  const docId = active.dataset.id;
  localStorage.removeItem('checks_' + docId);
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
}

// ── Search ───────────────────────────────────────────────────────
function filterNav(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
}

// ── Mobile ───────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── Init ─────────────────────────────────────────────────────────
buildNav();
navigate('HOME');
</script>
</body>
</html>
